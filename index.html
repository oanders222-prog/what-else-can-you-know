const Q={A:{name:'Universal affirmative',f:(s,p)=>`All ${s} are ${p}.`},E:{name:'Universal negative',f:(s,p)=>`No ${s} are ${p}.`},I:{name:'Particular affirmative',f:(s,p)=>`Some ${s} are ${p}.`},O:{name:'Particular negative',f:(s,p)=>`Some ${s} are not ${p}.`}};
const lessons=[
['Foundations','The Mortal Socrates',['Socrates is a man.','All men are mortal.'],['Socrates is mortal.','All mortals are men.','Socrates is wise.','Plato is mortal.'],0,'The middle term connects Socrates to mortality.'],
['Foundations','Nothing from Nothing',['Nothing comes from nothing.','Something exists now.'],['There has never been absolute nothing.','Everything has always existed.','Matter is eternal.','The universe is necessary.'],0,'If absolute nothing had ever been the whole of reality, nothing could now exist.'],
['Natural Theology','No Uncaused Events',['There are no uncaused events.','An event is occurring now.'],['The present event has a cause.','Every cause is material.','The cause is inside the event.','The event caused itself.'],0,'The universal premise applies to the present event.'],
['Natural Theology','Something Has Always Existed',['There has never been absolute nothing.','Something exists now.'],['Something has always existed.','The present universe has always existed.','Every existing thing is eternal.','Time is an illusion.'],0,'Reality has never been wholly empty.'],
['Natural Theology','God of Change',['What is not self-maintaining cannot become self-existent.','Change is occurring.'],['Whatever is changing is not eternal.','Change is unreal.','Every changing thing is eternal.','Eternal is more basic than temporal.'],0,'Nothing that is temporal (with beginning) can become eternal (without begining).'],
['Natural Theology','No Infinite Deferral',['Every dependent cause requires an explanation outside itself.','An endless series of dependent causes would leave the whole series unexplained.'],['There must be a non-dependent explanatory ground.','There must be a first event in time.','The universe is made of ideas.','Every explanation is circular.'],0,'The conclusion concerns explanatory dependence, not necessarily temporal beginning.'],
['Part I · Spirit','Beyond Matter',['All material things are dependent, divisible, and subject to change.','Whatever is eternal is non-dependent and is self-maintaining.'],['What is eternal is not material.','The eternal is the largest material object.','Matter caused the eternal.','All matter is illusion.'],0,'God of dependent material reality cannot itself be merely another dependent material thing.'],
['Part I · Spirit','Knowledge and Will',['The ultimate source knows the order it produces.','It acts according to that known order rather than by external compulsion.'],['God has intellect and will.','God is impersonal matter.','God learns by trial and error.','Its effects cause it.'],0,'Knowledge belongs to intellect; action according to known order belongs to will.'],
['Part I · Spirit','What Is Spirit?',['The ultimate source is immaterial.','The ultimate source possesses intellect and will.'],['The ultimate source is spirit.','It is an abstract number.','It is a changing body.','It is identical with the universe.'],0,'Spirit here means an immaterial living reality possessing intellect and will.'],
['Part II · Incommunicable','Without Limit',['A limit in being must arise from an external limiter or a received restricted nature.','The self-existent source receives neither existence nor nature from another.'],['God is infinite in being.','God occupies infinite space.','God has infinitely many parts.','God is finite.'],0,'Infinite means unlimited in perfection of being, not spatially enormous.'],
['Part II · Incommunicable','Without Beginning or End',['Whatever begins to exist receives existence and is dependent.','The ultimate source exists necessarily and receives existence from no other.'],['God is eternal.','God began before all else.','It lasts a very long time.','It exists only with the universe.'],0,'A necessary underived being cannot begin or cease to be.'],
['Part II · Incommunicable','Not changing toward a goal',['Change requires increase or decrease.','Whatever is eternal is not changing toward anything.'],['The eternal is unchangeable.','God constantly improves.','God alternates between existence and nonexistence.','God changes whenever creatures change.'],0,'A being that is eternal cannot become more or less perfect.'],
['Part III · Communicable','Wisdom',['God perfectly knows itself and the order of dependent reality.','Perfect knowledge ordered to right ends is wisdom.'],['God is wise.','God is ignorant.','God discovers truth over time.','Wisdom is unrelated to knowledge.'],0,'Wisdom is perfect knowledge ordered to fitting ends.'],
['Part III · Communicable','Power',['Every finite power ultimately derives from the first source.','The first source depends on no prior power to act.'],['God is powerful in an underived way.','It is only potentially able to act.','Creatures supply its power.','Power has no ground.'],0,'The first source is the underived ground of every finite causal power.'],
['Part III · Communicable','Holiness',['Moral evil is a defect of right order.','The infinite and unchangeable source lacks no perfection and wills perfect moral order.'],['God is holy.','God contains moral defect.','Good and evil are equally ultimate.','Holiness requires moral improvement.'],0,'Holiness is perfect freedom from moral defect.'],
['Part III · Communicable','Justice',['Justice gives to each what is due according to truth and right order.','God perfectly knows truth and wills right order.'],['God is just.','God judges ignorantly.','Justice is arbitrary power.','Right order is above God.'],0,'Perfect knowledge joined with a will for right order entails justice.'],
['Part III · Communicable','Goodness',['Good for a being is based on the nature of that being.','God the Creator determiner what is good for a being by creating that being.'],['God is good.','God is morally neutral.','Finite goods arise from total defect.','Goodness is merely preference.'],0,'The fullness of being without defect is good.'],

function rel(fig,S,P,M){return +fig===1?[[M,P],[S,M]]:+fig===2?[[P,M],[S,M]]:+fig===3?[[M,P],[M,S]]:[[P,M],[M,S]]}function holds(t,a,b,w){let ab=false,anb=false;for(let m=0;m<8;m++)if(w[m]){const A=!!(m&(1<<a)),B=!!(m&(1<<b));if(A&&B)ab=true;if(A&&!B)anb=true}return t==='A'?!anb:t==='E'?!ab:t==='I'?ab:anb}function exists(t,w){return w.some((x,m)=>x&&m&(1<<t))}function test(ma,mi,c,f,ex){const r=rel(f,0,1,2);for(let bits=1;bits<256;bits++){const w=Array.from({length:8},(_,i)=>!!(bits&(1<<i)));if(ex.S&&!exists(0,w)||ex.P&&!exists(1,w)||ex.M&&!exists(2,w))continue;if(holds(ma,...r[0],w)&&holds(mi,...r[1],w)&&!holds(c,0,1,w))return{valid:false,w}}return{valid:true}}
function distribution(t){return{subject:t==='A'||t==='E',predicate:t==='E'||t==='O'}}function ruleDiagnosis(ma,mi,c,f){const r=rel(f,'S','P','M'),d1=distribution(ma),d2=distribution(mi),dc=distribution(c);let major={S:r[0][0],P:r[0][1],dS:d1.subject,dP:d1.predicate},minor={S:r[1][0],P:r[1][1],dS:d2.subject,dP:d2.predicate};const dist=(term,x)=>x.S===term?x.dS:x.P===term?x.dP:false;const negPrem=[ma,mi].filter(x=>x==='E'||x==='O').length,partPrem=[ma,mi].filter(x=>x==='I'||x==='O').length,negCon=c==='E'||c==='O';let fails=[];if(!dist('M',major)&&!dist('M',minor))fails.push('The middle term is undistributed in both premises.');if(dc.subject&&!dist('S',minor))fails.push('Illicit minor: S is distributed in the conclusion but not in the minor premise.');if(dc.predicate&&!dist('P',major))fails.push('Illicit major: P is distributed in the conclusion but not in the major premise.');if(negPrem===2)fails.push('Two negative premises yield no valid conclusion.');if(negPrem===1&&!negCon)fails.push('A negative premise requires a negative conclusion.');if(negPrem===0&&negCon)fails.push('A negative conclusion requires one negative premise.');if(partPrem===2)fails.push('Two particular premises yield no valid conclusion.');if(partPrem>=1&&c!=='I'&&c!=='O')fails.push('A particular premise cannot support a universal conclusion.');return fails}
function renderSyl(){game.innerHTML=`<div class="section-title"><div class="eyebrow">Classical Logic Workshop</div><h2>Syllogism Lab</h2><p class="explain">Enter the terms, mood, and figure. The calculator checks all possible class-membership models and reports any violated traditional rule.</p></div><div class="grid"><section class="panel"><div class="terms"><div class="field"><label>Subject S</label><input id="S" value="philosophers"></div><div class="field"><label>Predicate P</label><input id="P" value="mortals"></div><div class="field"><label>Middle M</label><input id="M" value="humans"></div></div><div class="terms"><div class="field"><label>Major</label><select id="ma">${opts()}</select></div><div class="field"><label>Minor</label><select id="mi">${opts()}</select></div><div class="field"><label>Conclusion</label><select id="co">${opts()}</select></div></div><div class="field"><label>Figure</label><select id="fig"><option value="1">1: M–P; S–M</option><option value="2">2: P–M; S–M</option><option value="3">3: M–P; M–S</option><option value="4">4: P–M; M–S</option></select></div><div class="inline-checks"><label><input type="checkbox" id="eS"> S exists</label><label><input type="checkbox" id="eP"> P exists</label><label><input type="checkbox" id="eM"> M exists</label></div><div class="controls"><button class="btn primary" onclick="calcSyl()">Test syllogism</button></div></section><section class="panel"><h3>Your argument</h3><div id="preview"></div><div id="sres" class="result"></div></section></div>${syllogismDirections()}`;['S','P','M','ma','mi','co','fig'].forEach(id=>document.getElementById(id).oninput=previewSyl);previewSyl()}

function syllogismDirections(){return `<details open><summary>Directions: how to test a classical categorical syllogism</summary><ol class="steps"><li>Identify the conclusion. Its subject is the <b>minor term S</b>; its predicate is the <b>major term P</b>.</li><li>The remaining term is the <b>middle term M</b>. It must occur once in each premise and never in the conclusion.</li><li>Put the premise containing P first as the <b>major premise</b>. Put the premise containing S second as the <b>minor premise</b>.</li><li>Classify each proposition as A, E, I, or O. The three letters give the mood.</li><li>Locate M in the premises to determine the figure: 1 = M–P / S–M; 2 = P–M / S–M; 3 = M–P / M–S; 4 = P–M / M–S.</li><li>Apply the validity rules below, then use the calculator to confirm the result.</li></ol></details><details open><summary>Rules of inference for classical syllogisms</summary><div class="rule"><b>1. Exactly three terms.</b> The argument must use S, P, and M in the same sense throughout. A shift in meaning creates four terms.</div><div class="rule"><b>2. Distribute the middle term at least once.</b> Otherwise the premises may refer to different portions of the middle class.</div><div class="rule"><b>3. Do not distribute a term in the conclusion unless it was distributed in its premise.</b> Violations are illicit major or illicit minor.</div><div class="rule"><b>4. No conclusion from two negative premises.</b> Two exclusions do not establish a relation between S and P.</div><div class="rule"><b>5. A negative premise and a negative conclusion must occur together.</b> Exactly one negative premise requires a negative conclusion, and a negative conclusion requires one negative premise.</div><div class="rule"><b>6. No conclusion from two particular premises.</b> Two claims about unspecified members may not connect the classes.</div><div class="rule"><b>7. A particular premise cannot yield a universal conclusion.</b> The conclusion cannot say more than the premises establish.</div><div class="rule"><b>8. Existential import matters.</b> In Boolean logic, A and E propositions do not assert that their subjects exist. Traditional subalternation and weakened conclusions require an existence assumption.</div><div class="tablewrap"><table><tr><th>Form</th><th>Statement</th><th>Distributed terms</th></tr><tr><td>A</td><td>All S are P</td><td>S only</td></tr><tr><td>E</td><td>No S are P</td><td>S and P</td></tr><tr><td>I</td><td>Some S are P</td><td>Neither</td></tr><tr><td>O</td><td>Some S are not P</td><td>P only</td></tr></table></div></details>`}
function comp(x){return `non-${x}`}function imm(t,op,s,p,ex){if(op==='obversion'){const m={A:'E',E:'A',I:'O',O:'I'};return{ok:true,out:prop(m[t],s,comp(p)),why:'Change the quality and replace the predicate with its complement.'}}if(op==='conversion'){if(t==='E'||t==='I')return{ok:true,out:prop(t,p,s),why:'Interchange subject and predicate.'};if(t==='A'&&ex)return{ok:'conditional',out:prop('I',p,s),why:'Conversion by limitation requires existence of the original subject class.'};return{ok:false,out:prop(t,p,s),why:t==='A'?'A does not convert simply.':'O does not convert.'}}if(t==='A'||t==='O')return{ok:true,out:prop(t,comp(p),comp(s)),why:'Replace both terms with their complements and interchange them.'};if(t==='E'&&ex)return{ok:'conditional',out:prop('O',comp(p),comp(s)),why:'Contraposition by limitation requires existential import.'};return{ok:false,out:prop(t,comp(p),comp(s)),why:t==='E'?'E does not contrapose simply.':'I does not contrapose.'}}

function immediateDirections(){return `<details open><summary>Directions for conversion, obversion, and contraposition</summary><h3>Conversion</h3><ol class="steps"><li>Keep the quality and quantity unchanged for simple conversion.</li><li>Interchange the subject and predicate: S–P becomes P–S.</li><li>Check validity: E and I convert simply. A converts only by limitation, producing I, when S exists. O does not convert.</li></ol><div class="rule"><b>Example:</b> No poets are machines → No machines are poets.</div><h3>Obversion</h3><ol class="steps"><li>Keep the quantity unchanged.</li><li>Change the quality: affirmative becomes negative; negative becomes affirmative.</li><li>Replace the predicate with its complement: P becomes non-P.</li><li>Obversion is valid for A, E, I, and O.</li></ol><div class="rule"><b>Example:</b> All humans are mortal → No humans are non-mortal.</div><h3>Contraposition</h3><ol class="steps"><li>Replace both terms with their complements.</li><li>Interchange them: S–P becomes non-P–non-S.</li><li>Keep the original quality and quantity for simple contraposition.</li><li>A and O contrapose simply. E contraposes only by limitation with existential import. I does not contrapose.</li></ol><div class="rule"><b>Example:</b> All humans are mortal → All non-mortals are non-humans.</div><div class="tablewrap"><table><tr><th>Form</th><th>Conversion</th><th>Obversion</th><th>Contraposition</th></tr><tr><td>A</td><td>By limitation*</td><td>Valid</td><td>Valid</td></tr><tr><td>E</td><td>Valid</td><td>Valid</td><td>By limitation*</td></tr><tr><td>I</td><td>Valid</td><td>Valid</td><td>Invalid</td></tr><tr><td>O</td><td>Invalid</td><td>Valid</td><td>Valid</td></tr></table><p class="small">*Requires existential import and changes a universal proposition into a particular proposition.</p></div></details>`}

{id:'greece',name:'Greece',marker:'GR',x:51.5,y:36,philosophy:'Dualism',summary:'Reality is explained by two co-ultimate principles, commonly spirit and matter or form and matter, so that the world is not grounded in one self-sufficient source.',question:'Which critique most directly refutes the reigning philosophy of this region?',answers:['If two principles are equally ultimate, the unity of reality and their interaction remain unexplained.','Dualists always deny the soul.','Greece is geographically small, so its philosophy must be false.','If matter exists, then matter alone must be ultimate.'],correct:0,explanation:'Dualism leaves explanation divided. When two principles are equally basic, neither explains the other, and the coherence of the whole remains dependent on an unexplained relation between them.',why:'The refutation preserves the need for a single ultimate explanatory ground rather than two coordinate ultimates.',philosophers:['Plato','Aristotle','Middle Platonism'],nextTargets:['Neoplatonism','Gnosticism'],review:['Natural Theology','No Infinite Deferral']},
{id:'france',name:'France',marker:'FR',x:47.2,y:31,philosophy:'Material Monism',summary:'Only matter in motion is ultimately real. Mind, reason, moral obligation, and purpose are reduced to physical processes.',question:'Which critique most directly refutes the reigning philosophy of this region?',answers:['If thought is nothing more than matter in motion, reason loses its claim to universal and normative truth.','Material monism is false because some people dislike science.','Matter can exist only if it is an illusion.','Every materialist denies that anything exists.'],correct:0,explanation:'The critique challenges the self-defeat of reductionism. If every belief is merely a physical event, then the claim that material monism is rationally true becomes indistinguishable from any other motion of matter.',why:'This refutation protects the objectivity of logic, truth, and moral judgment against reduction to blind mechanism.',philosophers:['La Mettrie','d’Holbach','French materialists'],nextTargets:['Positivism','Secular humanism'],review:['Part III · Being','Part III · Truth']},
{id:'england',name:'England',marker:'EN',x:46.2,y:27,philosophy:'Deism',summary:'A creator may exist, but he does not providentially govern the world, reveal himself specially, or intervene in history.',question:'Which critique most directly refutes the reigning philosophy of this region?',answers:['A merely absent creator cannot explain the world’s ongoing dependence, providence, miracles, or revelation.','Deism is false because every English philosopher was an atheist.','If God is transcendent, he cannot act in the world.','Any appeal to design proves polytheism.'],correct:0,explanation:'Deism truncates causality after creation. But if the world depends on God for its being and order, divine governance is not an optional add-on but part of the very explanation of reality.',why:'The challenge highlights that creation, providence, and revelation belong together rather than being artificially separated.',philosophers:['Herbert of Cherbury','John Toland','Matthew Tindal'],nextTargets:['Empiricism','Skepticism'],review:['Natural Theology','God of Change']}
];
function worldConqueredCount(){return worldRegions.filter(r=>state.world&&state.world[r.id]).length}
function worldPct(){return Math.round(worldConqueredCount()/worldRegions.length*100)}
function renderWorldConquest(sel){if(sel)worldCurrent=sel;const r=worldRegions.find(x=>x.id===worldCurrent)||worldRegions[0],conquered=worldConqueredCount(),msg=worldMessage&&worldMessage.id===r.id?worldMessage:null;game.innerHTML=`<div class="section-title"><div class="eyebrow">Global Apologetics</div><h2>World Conquest</h2><p class="explain">Move your cursor across the world and refute the reigning philosophy in each region. This system is expandable: each region can later be subdivided into individual philosophers and schools.</p></div><div class="world-shell"><section class="world-map-panel"><div class="world-head"><div><div class="world-badge">${conquered}/${worldRegions.length} regions conquered</div></div><div class="world-stats"><span class="small">Progress</span><div class="meter" style="min-width:160px"><span style="width:${worldPct()}%"></span></div></div></div><div class="world-map">${worldRegions.map(x=>`<button class="marker ${x.id===r.id?'active':''} ${state.world&&state.world[x.id]?'conquered':''}" style="left:${x.x}%;top:${x.y}%" onclick="renderWorldConquest('${x.id}')" title="${x.name}: ${x.philosophy}">${state.world&&state.world[x.id]?'✓':x.marker}</button><div class="marker-label" style="left:${x.x}%;top:${x.y}%">${x.name}</div>`).join('')}</div><div class="world-legend"><span class="legend-item"><span class="legend-dot"></span> Target region</span><span class="legend-item"><span class="legend-dot done"></span> Conquered region</span></div><p class="map-note">Future expansion is simple: add a new region object with coordinates, a ruling philosophy, philosopher targets, and a refutation challenge.</p></section><section class="world-info"><div class="eyebrow">Selected Region</div><h3 style="margin:.2rem 0 0">${r.name}</h3><div class="region-meta"><span class="pill">${r.philosophy}</span><span class="pill">Representative thinkers: ${r.philosophers.join(', ')}</span></div><p>${r.summary}</p><div class="statement"><b>Challenge:</b> ${r.question}</div><div class="world-choices">${r.answers.map((a,i)=>`<button class="answer" onclick="answerWorld('${r.id}',${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${a}</span><span aria-hidden="true">›</span></button>`).join('')}</div><div id="worldfb" class="result ${msg?'show '+msg.type:''}">${msg?msg.html:''}</div><div class="world-foot"><button class="btn" onclick="backChallenges()">Back to Challenges</button><button class="btn" onclick="clearWorldConquest()">Reset Conquest</button></div><div class="world-next"><div class="small"><b>Expandable next targets:</b> ${r.nextTargets.join(', ')}</div><div class="small"><b>Suggested review:</b> ${r.review.join(' · ')}</div></div></section></div>`;updateStatus(`World Conquest · ${conquered}/${worldRegions.length} regions`)}
function answerWorld(id,i){const r=worldRegions.find(x=>x.id===id);if(!r)return;if(i===r.correct){state.world[id]=true;save();worldMessage={id,type:'good',html:`<strong>Region conquered.</strong><p>${r.explanation}</p><p><b>Why this matters:</b> ${r.why}</p>`}}else{worldMessage={id,type:'bad',html:`<strong>Not yet.</strong><p>That answer does not strike at the central weakness of ${r.philosophy.toLowerCase()}.</p><p><b>Best answer:</b> ${r.answers[r.correct]}</p><p>${r.explanation}</p>`}}renderWorldConquest(id)}
function clearWorldConquest(){state.world={};worldMessage=null;save();renderWorldConquest(worldCurrent)}
function H(t,x,role){const cls=role==='S'?'termS':role==='P'?'termP':'termM';return `<span class="${cls}">${esc(x)}</span>`}
function markedProp(t,a,b,ra,rb){const d=Q[t].d;let A=H(t,a,ra),B=H(t,b,rb);if(d[0])A=`<span class="dist">${A}</span>`;if(d[1])B=`<span class="dist">${B}</span>`;return Q[t].f(A,B)}
function renderChallenges(){game.innerHTML=`<div class="section-title"><div class="eyebrow">Advanced Practice</div><h2>Challenges</h2><p class="explain">Diagnose fallacies, explore opposition, conquer world philosophies, construct arguments, collect classical moods, review the proof map, or generate a custom challenge.</p></div><div class="challenge-grid">
${[['⚔','Defeat the Sophism','Find the exact broken rule and repair an invalid argument.','renderSophism()','Traditional fallacies'],['🗺','World Conquest','Move across the map and refute the reigning philosophy in each region.','renderWorldConquest()','Expandable by region and philosopher'],['◇','Square of Opposition','Explore contradiction, contrariety, subcontrariety, and subalternation.','renderSquare()','Traditional and Boolean views'],['✎','Construct an Argument','Produce conclusions and missing premises rather than recognizing them.','renderConstruct()','Built-response practice'],['🏺','Classical Moods','Master Barbara, Celarent, Darii, Ferio, and the other valid moods.','renderMoods()','Collection and mastery'],['⌁','Argument Map','See how each natural-theology conclusion becomes a premise for the next.','renderMap()','Cumulative proof path'],['⚙','Challenge Generator','Create valid, invalid, missing-premise, and immediate-inference problems.','renderGenerator()','Use any terms you choose']].map(x=>`<section class="challenge-card"><div style="font-size:1.8rem;color:var(--gold2)">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><span class="tiny">${x[4]}</span><button class="btn" onclick="${x[3]}">Open</button></section>`).join('')}</div>`;updateStatus('Advanced Challenges')}
function backChallenges(){renderChallenges()}
function argHTML(x){const r=rel(x.f,x.s,x.p,x.mid),m=x.m;return `<div class="statement"><b>Major:</b> ${markedProp(m[0],r[0][0],r[0][1],r[0][0]===x.s?'S':r[0][0]===x.p?'P':'M',r[0][1]===x.s?'S':r[0][1]===x.p?'P':'M')}</div><div class="statement"><b>Minor:</b> ${markedProp(m[1],r[1][0],r[1][1],r[1][0]===x.s?'S':r[1][0]===x.p?'P':'M',r[1][1]===x.s?'S':r[1][1]===x.p?'P':'M')}</div><div class="statement"><b>Conclusion:</b> ${markedProp(m[2],x.s,x.p,'S','P')}</div>`}
function renderSophism(){const x=sophisms[sophismIndex%sophisms.length], choices=[x.rule,...sophisms.map(y=>y.rule).filter(y=>y!==x.rule).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);game.innerHTML=`<div class="section-title"><div class="eyebrow">Defeat the Sophism ${sophismIndex+1}/${sophisms.length}</div><h2>Which rule was broken?</h2><p class="explain"><span class="termS">S minor</span> · <span class="termP">P major</span> · <span class="termM">M middle</span>. Double underlining marks distribution.</p></div>${argHTML(x)}<div class="choice-grid">${choices.map(c=>`<button class="answer" onclick="answerSophism('${c.replaceAll("'","\\'")}')"><span class="letter">?</span><span>${c}</span></button>`).join('')}</div><div id="sophfb" class="result"></div><div class="controls"><button class="btn" onclick="backChallenges()">Challenges</button><button class="btn primary" onclick="nextSophism()">Next Sophism</button></div>`}
function answerSophism(a){const x=sophisms[sophismIndex%sophisms.length],ok=a===x.rule;sophfb.className=`result show ${ok?'good':'bad'}`;sophfb.innerHTML=ok?`<strong>Sophism defeated.</strong><p>${ruleDiagnosis(x.m[0],x.m[1],x.m[2],x.f).join(' ')||x.rule}</p><p><b>Repair:</b> change a premise or conclusion so every distributed term and negative/particular relation satisfies the rules.</p>`:`<strong>Not this rule.</strong><p>Look at distribution first, then the number of negative and particular propositions. The exact failure is <b>${x.rule}</b>.</p>`}
function nextSophism(){sophismIndex=(sophismIndex+1)%sophisms.length;renderSophism()}
const squareData={A:{text:'All S are P',contra:'O',relations:{E:'Contrary',I:'Subaltern',O:'Contradictory'}},E:{text:'No S are P',contra:'I',relations:{A:'Contrary',I:'Contradictory',O:'Subaltern'}},I:{text:'Some S are P',contra:'E',relations:{A:'Superaltern',E:'Contradictory',O:'Subcontrary'}},O:{text:'Some S are not P',contra:'A',relations:{A:'Contradictory',E:'Superaltern',I:'Subcontrary'}}};
function renderSquare(active='A'){const d=squareData[active];game.innerHTML=`<div class="section-title"><div class="eyebrow">Interactive Diagram</div><h2>Square of Opposition</h2><p class="explain">Select a proposition to see its logical relations. Traditional subalternation assumes existential import.</p></div><div class="square-grid">${['A','E','I','O'].map(k=>`<button class="square-node ${k===active?'active':''}" onclick="renderSquare('${k}')"><b>${k}</b><br>${squareData[k].text}</button>`).join('')}</div><section class="panel"><h3>${active}: ${d.text}</h3>${Object.entries(d.relations).map(([k,v])=>`<div class="rule"><b>${v} with ${k}:</b> ${relationText(active,k,v)}</div>`).join('')}<div class="rule"><b>Modern Boolean caution:</b> A and E do not imply I or O unless the subject class exists.</div></section><div class="controls"><button class="btn" onclick="backChallenges()">Challenges</button></div>`}
function relationText(a,b,r){if(r==='Contradictory')return 'Exactly one is true and exactly one is false.';if(r==='Contrary')return 'They cannot both be true, though both may be false.';if(r==='Subcontrary')return 'They cannot both be false, though both may be true.';if(r==='Subaltern')return 'Truth descends from the universal to the particular when S exists.';return 'Truth ascends only from the corresponding universal; particular truth alone does not prove the universal.'}
const constructed=[
 {type:'conclusion',major:'All humans are mortal.',minor:'All philosophers are humans.',answer:'All philosophers are mortal.'},
 {type:'middle',major:'No reptiles are warm-blooded.',minor:'All snakes are reptiles.',answer:'reptiles'},
 {type:'missing',major:'All virtuous acts are praiseworthy.',conclusion:'All acts of courage are praiseworthy.',answer:'All acts of courage are virtuous acts.'},
 {type:'form',major:'No machines are persons.',minor:'Some computers are machines.',answer:'O'}
];
function renderConstruct(){const x=constructed[constructedIndex%constructed.length];let prompt=x.type==='conclusion'?'Type the conclusion that follows.':x.type==='middle'?'Type the middle term.':x.type==='missing'?'Supply the missing minor premise.':'Choose the form of the valid conclusion.';game.innerHTML=`<div class="section-title"><div class="eyebrow">Constructed Response ${constructedIndex+1}/${constructed.length}</div><h2>${prompt}</h2></div><div class="statement"><b>Major:</b> ${x.major}</div>${x.minor?`<div class="statement"><b>Minor:</b> ${x.minor}</div>`:''}${x.conclusion?`<div class="statement"><b>Conclusion:</b> ${x.conclusion}</div>`:''}<div class="field"><label>Your answer</label>${x.type==='form'?`<select id="constructAnswer">${opts()}</select>`:`<input id="constructAnswer" placeholder="Enter your answer">`}</div><div class="controls"><button class="btn primary" onclick="checkConstruct()">Check answer</button><button class="btn" onclick="backChallenges()">Challenges</button><button class="btn" onclick="nextConstruct()">Next</button></div><div id="constructFb" class="result"></div>`}
function norm(x){return x.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function checkConstruct(){const x=constructed[constructedIndex%constructed.length],a=constructAnswer.value,ok=x.type==='form'?a===x.answer:norm(a)===norm(x.answer);constructFb.className=`result show ${ok?'good':'bad'}`;constructFb.innerHTML=ok?`<strong>Correct.</strong> You produced the required part of the argument.`:`<strong>Review the structure.</strong><p>Expected answer: <b>${x.answer}</b></p>`}
function nextConstruct(){constructedIndex=(constructedIndex+1)%constructed.length;renderConstruct()}
function renderMoods(){const mastered=JSON.parse(localStorage.getItem('weyk-moods')||'[]');game.innerHTML=`<div class="section-title"><div class="eyebrow">Classical Collection</div><h2>Named Valid Moods</h2><p class="explain">Open the Syllogism Lab and successfully test a mood to mark it mastered.</p></div><div class="mood-grid">${Object.entries(validMoods).map(([k,v])=>`<div class="mood-card ${mastered.includes(k)?'mastered':''}"><b>${v}</b><div class="formula">${k}</div><span class="small">${mastered.includes(k)?'Mastered':'Not yet mastered'}</span></div>`).join('')}</div><div class="controls"><button class="btn" onclick="backChallenges()">Challenges</button><button class="btn primary" onclick="setView('syllogism')">Open Syllogism Lab</button></div>`}
function renderMap(){game.innerHTML=`<div class="section-title"><div class="eyebrow">Cumulative Natural Theology</div><h2>Argument Map</h2><p class="explain">Each established conclusion becomes part of the basis for the next inference.</p></div><div class="proof-map">${lessons.map((L,i)=>`<button class="proof-node ${i<=state.i?'done':''}" onclick="state.i=${i};save();renderCampaign()"><b>${L[0]}:</b> ${L[1]}<br><span class="small">${L[3][L[4]]}</span></button>${i<lessons.length-1?'<div class="proof-arrow">↓</div>':''}`).join('')}</div><div class="controls"><button class="btn" onclick="backChallenges()">Challenges</button></div>`}
function randomOf(a){return a[Math.floor(Math.random()*a.length)]}
function renderGenerator(){game.innerHTML=`<div class="section-title"><div class="eyebrow">Reusable Classroom Tool</div><h2>Custom Challenge Generator</h2><p class="explain">Enter any three terms and choose the kind of problem to generate.</p></div><div class="panel"><div class="terms"><div class="field"><label>S minor</label><input id="gS" value="philosophers"></div><div class="field"><label>P major</label><input id="gP" value="mortals"></div><div class="field"><label>M middle</label><input id="gM" value="humans"></div></div><div class="field"><label>Challenge type</label><select id="gType"><option value="valid">Valid syllogism</option><option value="invalid">Invalid syllogism</option><option value="missing">Missing conclusion</option><option value="immediate">Immediate inference</option></select></div><button class="btn primary" onclick="makeGenerated()">Generate</button></div><div id="generated" class="result neutral show">Choose terms and generate a challenge.</div><div class="controls"><button class="btn" onclick="backChallenges()">Challenges</button></div>`}
function makeGenerated(){const S=gS.value||'S',P=gP.value||'P',M=gM.value||'M',type=gType.value;if(type==='immediate'){const t=randomOf(['A','E','I','O']),op=randomOf(['conversion','obversion','contraposition']);generated.innerHTML=`<strong>${op[0].toUpperCase()+op.slice(1)} challenge</strong><div class="statement">${prop(t,S,P)}</div><p>Perform the inference, then check it in the Immediate Inference Lab.</p><button class="btn" onclick="setView('immediate')">Open Lab</button>`;return}const keys=Object.keys(validMoods),key=type==='invalid'?randomOf(['AAA-2','AEE-1','IIA-3','EAA-1']):randomOf(keys),[m,f]=key.split('-'),x={m,f:+f,s:S,p:P,mid:M};generated.innerHTML=`<strong>${type==='invalid'?'Find the fallacy':type==='missing'?'Supply the conclusion':'Test this valid mood'}</strong>${argHTML(x)}<p class="small">${type==='missing'?'Hide the conclusion and construct it before checking.':type==='valid'?`Classical name: ${validMoods[key]}`:'Explain the exact broken rule.'}</p>`}
// Enhanced syllogism lab with visual S/P/M marking and mood recognition.
function renderSyl(){game.innerHTML=`<div class="section-title"><div class="eyebrow">Classical Logic Workshop</div><h2>Syllogism Lab</h2><p class="explain"><span class="termS">S is the minor term</span>, <span class="termP">P is the major term</span>, and <span class="termM">M is the middle term</span>. Double underlining marks distributed terms.</p></div><div class="grid"><section class="panel"><div class="terms"><div class="field"><label>Subject S</label><input id="S" value="philosophers"></div><div class="field"><label>Predicate P</label><input id="P" value="mortals"></div><div class="field"><label>Middle M</label><input id="M" value="humans"></div></div><div class="terms"><div class="field"><label>Major</label><select id="ma">${opts()}</select></div><div class="field"><label>Minor</label><select id="mi">${opts()}</select></div><div class="field"><label>Conclusion</label><select id="co">${opts()}</select></div></div><div class="field"><label>Figure</label><select id="fig"><option value="1">1: M–P; S–M</option><option value="2">2: P–M; S–M</option><option value="3">3: M–P; M–S</option><option value="4">4: P–M; M–S</option></select></div><div class="inline-checks"><label><input type="checkbox" id="eS"> S exists</label><label><input type="checkbox" id="eP"> P exists</label><label><input type="checkbox" id="eM"> M exists</label></div><div class="controls"><button class="btn primary" onclick="calcSyl()">Test syllogism</button></div></section><section class="panel"><h3>Your argument</h3><div id="preview"></div><div id="sres" class="result"></div></section></div>${syllogismDirections()}`;['S','P','M','ma','mi','co','fig'].forEach(id=>document.getElementById(id).oninput=previewSyl);previewSyl()}
function roleOf(x){return x===S.value?'S':x===P.value?'P':'M'}
function previewSyl(){const r=rel(fig.value,S.value,P.value,M.value),key=`${ma.value}${mi.value}${co.value}-${fig.value}`;preview.innerHTML=`<div class="statement"><b>Major:</b> ${markedProp(ma.value,...r[0],roleOf(r[0][0]),roleOf(r[0][1]))}</div><div class="statement"><b>Minor:</b> ${markedProp(mi.value,...r[1],roleOf(r[1][0]),roleOf(r[1][1]))}</div><div class="statement"><b>Therefore:</b> ${markedProp(co.value,S.value,P.value,'S','P')}</div><p class="small">Mood and figure: ${key} ${validMoods[key]?`· <span class="badge">${validMoods[key]}</span>`:''}</p>`}
function calcSyl(){previewSyl();const key=`${ma.value}${mi.value}${co.value}-${fig.value}`,r=test(ma.value,mi.value,co.value,fig.value,{S:eS.checked,P:eP.checked,M:eM.checked}),fails=ruleDiagnosis(ma.value,mi.value,co.value,fig.value);sres.className=`result show ${r.valid?'good':'bad'}`;if(r.valid){let mastered=JSON.parse(localStorage.getItem('weyk-moods')||'[]');if(validMoods[key]&&!mastered.includes(key)){mastered.push(key);localStorage.setItem('weyk-moods',JSON.stringify(mastered))}sres.innerHTML=`<strong>Valid${validMoods[key]?`: ${validMoods[key]}`:''}.</strong><p>No countermodel exists under the selected assumptions.</p>${validMoods[key]?'<p>This classical mood has been added to your mastery collection.</p>':''}`}else{sres.innerHTML=`<strong>Invalid.</strong>${fails.length?'<p>Traditional rule diagnosis:</p><ul>'+fails.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p>The premises can be true while the conclusion is false. Review existential import and figure-specific restrictions.</p>'}`}}

renderHome();
</script></body></html>
